name: Update prices
 
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "اكتب 1 لإعادة قراءة المواقع بالذكاء الاصطناعي حتى لو تمت اليوم"
        default: "0"
 
permissions:
  contents: write
 
concurrency:
  group: update-prices
  cancel-in-progress: false
 
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fill prices with Gemini
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE: ${{ github.event.inputs.force }}
        run: python auto_fill.py
      - run: python fetch_prices.py
        env:
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
      - name: Commit changes
        run: |
          git config user.name "price-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Update prices $(date -u +%F)"
          git pull --rebase
          git push
 
